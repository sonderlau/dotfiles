# Absolute paths to sync (~ is expanded)
# Indented lines starting with ! are exclude patterns
# Destination defaults to stripping $HOME/, or use source => relative destination
# Generated dependencies, caches, images and design drawings are excluded globally

~/.zshrc
~/.config/ghostty
  !shaders
~/.config/lazygit

~/.config/fish
  !secrets.fish
  !completions
  !*.bak*
  !*backup*
  !*.lock

~/.config/yazi

~/.config/starship.toml

~/.config/zellij

~/.config/zed
  !prompts

# Settings and an extension manifest only. scripts/export-pi-agent.py does not copy extension source.
~/.pi/agent
~/.pi/agent/npm/node_modules/@bachi/pi-coder/extensions/plan-mode => backups/pi-coder/extensions/plan-mode
~/.pi/agent/npm/node_modules/@bachi/pi-coder/extensions/bash-command-collapse/sandbox-mode.ts => backups/pi-coder/extensions/bash-command-collapse/sandbox-mode.ts
~/.pi/agent/npm/node_modules/@bachi/pi-coder/extensions/ask-user-question => backups/pi-coder/extensions/ask-user-question
~/.pi/agent/npm/node_modules/@bachi/pi-coder/package.json => backups/pi-coder/package.json

~/.config/karabiner
  !automatic_backups

# This app directory is exported by scripts/export-clash-party.py, never raw copied
~/Library/Application Support/mihomo-party => backups/clash-party

# Squirrel user config only. Not build/, backups, userdb, or the rime-ice corpus.
~/Library/Rime/squirrel.custom.yaml
~/Library/Rime/default.custom.yaml
~/Library/Rime/double_pinyin_flypy.custom.yaml
~/Library/Rime/melt_eng.custom.yaml
~/Library/Rime/radical_pinyin.custom.yaml
~/Library/Rime/custom_phrase_double.txt
~/Library/Rime/xhup_lookup.schema.yaml
~/Library/Rime/xhup.dict.yaml
~/Library/Rime/xhup_dicts
~/Library/Rime/lua/xhup_filter.lua
~/Library/Rime/lua/input_route_probe.lua

~/Dev/home-assistant
  !.pi
  !/docs/
  !/tmp/
  !secrets
  !secrets.yaml
  !.env
  !.env.*
  !*.env
  !.storage
  !*.db
  !*.db-*
