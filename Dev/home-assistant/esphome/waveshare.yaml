    id: ic_elapsed
    resize: 20x20
    type: BINARY
  - platform: file
    file: mdi:logout
    id: ic_out
    resize: 20x20
    type: BINARY
  - platform: file
    file: mdi:logout
    id: ic_out_lg
    resize: 28x28
    type: BINARY
  - platform: file
    file: mdi:home
    id: ic_home
    resize: 20x20
    type: BINARY
  - platform: file
    file: mdi:home
    id: ic_home_lg
    resize: 28x28
    type: BINARY
  - platform: file
    file: mdi:seat-outline
    id: ic_sit
    resize: 28x28
    type: BINARY
  - platform: file
    file: mdi:walk
    id: ic_walk
    resize: 28x28
    type: BINARY
  - platform: file
    file: mdi:check-bold
    id: ic_ok
    resize: 28x28
    type: BINARY
  - platform: file
