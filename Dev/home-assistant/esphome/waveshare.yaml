  - platform: homeassistant
    id: ha_clock_in_ts
    entity_id: input_datetime.attendance_clock_in
    attribute: timestamp
    on_value:
      - component.update: work_minutes
  - platform: homeassistant
    id: ha_clock_out_ts
    entity_id: input_datetime.attendance_clock_out
    attribute: timestamp
    on_value:
      - component.update: work_minutes
  - platform: template
    name: Work Minutes
    id: work_minutes
    unit_of_measurement: min
    accuracy_decimals: 0
    icon: mdi:briefcase-clock
    update_interval: 15s
    lambda: |-
      AttendanceView punches = attendance_view(id(punch_kind), id(punch_ts));
      bool ha_in = id(ha_in_set).has_state() && id(ha_in_set).state;
      bool ha_out = id(ha_out_set).has_state() && id(ha_out_set).state;
      uint32_t start_u = 0;
      if (punches.in_ts != 0) {
        start_u = punches.in_ts;
      } else if (ha_in && !isnan(id(ha_clock_in_ts).state)) {
        start_u = (uint32_t) id(ha_clock_in_ts).state;
      }
      if (start_u == 0) {
        return {};
      }
      uint32_t end_u = 0;
      bool have_end = false;
      if (punches.closed_out) {
        end_u = punches.out_ts;
        have_end = true;
      } else if (ha_out && !punches.open_in && !isnan(id(ha_clock_out_ts).state)) {
        end_u = (uint32_t) id(ha_clock_out_ts).state;
        have_end = true;
      } else {
        auto t = id(rtc_time).now();
        if (!t.is_valid()) {
          t = id(sntp_time).now();
        }
        if (!t.is_valid()) {
          t = id(ha_time).now();
        }
        if (t.is_valid()) {
          end_u = (uint32_t) t.timestamp;
          have_end = true;
        }
      }
      if (!have_end || end_u < start_u) {
        return {};
      }
      float mins = (float) (end_u - start_u) / 60.0f;
      if (mins < 0.0f) {
        mins = 0.0f;
      }
      return mins;
  - platform: template
    name: Sit Minutes
    id: sit_minutes
    unit_of_measurement: min
    accuracy_decimals: 0
    icon: mdi:seat-outline
    update_interval: 5s
    on_value:
      then:
        - lambda: |-
            static bool last_warn = false;
            static int last_shown = -1;
            if (isnan(x)) {
              return;
            }
            bool acked = id(ha_sit_acked).has_state() && id(ha_sit_acked).state;
            bool warn = !acked && x >= id(sit_warn_min).state;
            int shown = (int) x;
            if (warn != last_warn || (warn && shown != last_shown)) {
              last_warn = warn;
              last_shown = shown;
              id(rlcd).update();
              delay(40);
              id(rlcd).low_power_mode();
            }
    lambda: |-
      auto t = id(rtc_time).now();
      if (!t.is_valid()) {
        t = id(sntp_time).now();
      }
      if (!t.is_valid()) {
        t = id(ha_time).now();
      }
      if (!id(ha_sit_active).has_state() || !id(ha_sit_active).state) {
        return 0.0f;
      }
      if (!t.is_valid() || isnan(id(ha_sit_started).state)) {
        return {};
      }
      float mins = (t.timestamp - id(ha_sit_started).state) / 60.0f;
      if (mins < 0.0f) {
        mins = 0.0f;
      }
      return mins;
  - platform: homeassistant
    id: ha_away_since
    entity_id: input_datetime.desk_away_since
    attribute: timestamp
    on_value:
      - component.update: rest_remain
  - platform: template
    name: Rest Remain
    id: rest_remain
    unit_of_measurement: s
    accuracy_decimals: 0
    icon: mdi:walk
    update_interval: 5s
    lambda: |-
      if (id(desk_occupied).has_state() && id(desk_occupied).state) {
        return {};
      }
      auto t = id(rtc_time).now();
      if (!t.is_valid()) {
        t = id(sntp_time).now();
      }
      if (!t.is_valid()) {
        t = id(ha_time).now();
      }
      if (!t.is_valid() || isnan(id(ha_away_since).state)) {
        return {};
      }
      const float need = 120.0f;
      float sec = need - (t.timestamp - id(ha_away_since).state);
      if (sec < 0.0f) {
        sec = 0.0f;
      }
      return sec;

script:
  - id: paint_rlcd
    then:
      - lambda: |-
          id(rlcd).update();
          delay(40);  // high-power frame must finish or black blocks invert
          id(rlcd).low_power_mode();
  - id: flush_punches
    mode: single
    then:
      - lambda: id(flush_hold) = false;
      - while:
          condition:
            lambda: |-
              return !id(flush_hold) && id(ha_api).is_connected()
                     && attendance_count(id(punch_kind)) > 0;
          then:
            - lambda: |-
                uint8_t kind = id(punch_kind)[0];
                bool in_known = id(ha_in_set).has_state();
                bool out_known = id(ha_out_set).has_state();
                bool in_set = in_known && id(ha_in_set).state;
                bool out_set = out_known && id(ha_out_set).state;
                if (attendance_drop_head(kind, id(punch_ts)[0], in_known, in_set, id(ha_clock_in_ts).state, out_known, out_set, id(ha_clock_out_ts).state)) {
                  attendance_pop(id(punch_kind), id(punch_ts));
                  id(flush_skip_send) = true;
                  ESP_LOGI("attendance", "punch already settled on HA");
                } else {
                  id(flush_skip_send) = false;
                }
            - if:
                condition:
                  lambda: |-
                    return !id(flush_skip_send) && attendance_count(id(punch_kind)) > 0;
                then:
                  - if:
                      condition:
                        lambda: "return id(punch_kind)[0] == 1;"
                      then:
                        - homeassistant.event:
                            event: esphome.attendance_clock_in
                            data:
                              punched_at: !lambda |-
                                auto tt = ESPTime::from_epoch_local((time_t) id(punch_ts)[0]);
                                return tt.strftime("%Y-%m-%d %H:%M:%S");
                  - if:
                      condition:
                        lambda: "return id(punch_kind)[0] == 2;"
                      then:
                        - homeassistant.event:
                            event: esphome.attendance_clock_out
                            data:
                              punched_at: !lambda |-
                                auto tt = ESPTime::from_epoch_local((time_t) id(punch_ts)[0]);
                                return tt.strftime("%Y-%m-%d %H:%M:%S");
                  - delay: 4s
                  - lambda: |-
                      uint8_t kind = id(punch_kind)[0];
                      bool in_known = id(ha_in_set).has_state();
                      bool out_known = id(ha_out_set).has_state();
                      bool in_set = in_known && id(ha_in_set).state;
                      bool out_set = out_known && id(ha_out_set).state;
                      if (attendance_drop_head(kind, id(punch_ts)[0], in_known, in_set, id(ha_clock_in_ts).state, out_known, out_set, id(ha_clock_out_ts).state)) {
                        attendance_pop(id(punch_kind), id(punch_ts));
                        id(flush_skip_send) = true;
                        ESP_LOGI("attendance", "punch synced");
                      } else {
                        id(flush_hold) = true;
                        ESP_LOGW("attendance", "punch waiting for HA");
                      }
            - if:
                condition:
                  lambda: "return id(flush_skip_send);"
                then:
                  - component.update: work_minutes
                  - script.execute: paint_rlcd

interval:
  - interval: 1s
    then:
      - lambda: |-
          bool host = usb_serial_jtag_is_connected();
          if (host) {
            id(seen_usb_host) = true;
            id(on_mains) = true;
          } else if (id(seen_usb_host)) {
            id(on_mains) = false;
          }
          if (!id(usb_host).has_state() || id(usb_host).state != host) {
            id(usb_host).publish_state(host);
          }
          if (!id(external_power).has_state() || id(external_power).state != id(on_mains)) {
            id(external_power).publish_state(id(on_mains));
          }
          if (id(rest_timing) && millis() - id(rest_started_ms) >= 120000UL) {
            id(rest_timing) = false;
          }
          bool ack_was = id(punch_ack) > 0;
          if (id(punch_ack) > 0) {
            id(punch_ack)--;
          }
          bool want_live = id(rest_timing) || id(punch_ack) > 0 || ack_was;
          auto t = id(rtc_time).now();
          if (!t.is_valid()) {
            t = id(sntp_time).now();
          }
          int minute = t.is_valid() ? t.minute : -1;
          static int last_minute = -2;
          bool minute_tick = minute >= 0 && minute != last_minute;
          if (minute_tick) {
            last_minute = minute;
          }
          if (want_live || minute_tick) {
            id(rlcd).update();
            delay(40);
            id(rlcd).low_power_mode();
          }
  - interval: 15s
    then:
      - script.execute: flush_punches

