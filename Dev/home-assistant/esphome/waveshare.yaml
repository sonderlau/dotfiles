  - platform: homeassistant
    id: desk_occupied
    name: Desk Occupied
    entity_id: binary_sensor.desk_occupied
    on_state:
      - lambda: |-
          static bool was_on = false;
          bool now_on = id(desk_occupied).state;
          AttendanceView punches = attendance_view(id(punch_kind), id(punch_ts));
          bool ha_open = id(ha_in_set).has_state() && id(ha_in_set).state
                         && !(id(ha_out_set).has_state() && id(ha_out_set).state);
          bool clocked_in = punches.open_in || (ha_open && !punches.closed_out);
          if (now_on) {
            id(rest_timing) = false;
          } else if (was_on && clocked_in) {
            id(rest_started_ms) = millis();
            id(rest_timing) = true;
          }
          was_on = now_on;
      - component.update: rest_remain
      - script.execute: paint_rlcd
  - platform: homeassistant
