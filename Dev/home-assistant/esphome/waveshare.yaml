# Waveshare ESP32-S3-RLCD-4.2
# 文档: https://docs.waveshare.net/ESP32-S3-RLCD-4.2/
#
# 实测硬件: ESP32-S3 rev v0.2 / 16MB Quad Flash / 8MB Octal PSRAM
# USB 原生 USB-Serial/JTAG    串口 /dev/cu.usbmodem1101    MAC 94:a9:90:de:d0:cc
#
# 刷写:
#   esphome run --device /dev/cu.usbmodem1101 esphome/waveshare.yaml
# 之后 OTA:
#   esphome run esphome/waveshare.yaml

substitutions:
  device_name: waveshare-rlcd-42
  friendly_name: ESP32-S3-RLCD-4.2

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.8.0
  name_add_mac_suffix: false
  includes:
    - attendance_queue.h
  includes_c:
    - <driver/usb_serial_jtag.h>
  on_boot:
    - priority: -100
      then:
        - script.execute: paint_rlcd

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

external_components:
  - source: github://kylehase/ESPHome-ST7305-RLCD@5a3e9456c94e2eb85280c24e6c2e18b1f7e03406
    components: [st7305_rlcd]

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: INFO
  logs:
    component: ERROR
    pcf85063: INFO
    sntp: INFO
    i2c.idf: INFO

api:
  id: ha_api
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s
  on_client_connected:
    - delay: 5s
    - script.execute: flush_punches

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_password

captive_portal:

globals:
  # 离线打卡。kind：0 空，1 上班，2 下班。时间是 UTC 秒，掉电后仍在。
  - id: punch_kind
    type: uint8_t[4]
    restore_value: true
    initial_value: "std::array<uint8_t, 4>{0, 0, 0, 0}"
  - id: punch_ts
    type: uint32_t[4]
    restore_value: true
    initial_value: "std::array<uint32_t, 4>{0, 0, 0, 0}"
  - id: flush_hold
    type: bool
    restore_value: false
    initial_value: "false"
  - id: flush_skip_send
    type: bool
    restore_value: false
    initial_value: "false"
  - id: rest_timing
    type: bool
    restore_value: false
    initial_value: "false"
  - id: rest_started_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  # 原理图没有 VBUS/STAT 接到 GPIO。充电砖不发 SOF，无法和电池区分。
  # 没见过 USB 主机时保持外接电源；见过主机再断开，才当作电池。
  # 外接电源只改电池图标。屏幕保持静止刷新，避免每秒整屏重画把按键卡住。
  - id: on_mains
    type: bool
    restore_value: false
    initial_value: "true"
  - id: seen_usb_host
    type: bool
    restore_value: false
    initial_value: "false"
  # 打卡键按下后先亮一下，确认这次按键被看到了。单位是秒。
  - id: punch_ack
    type: uint8_t
    restore_value: false
    initial_value: "0"

web_server:
  port: 80

i2c:
  sda: GPIO13
  scl: GPIO14
  scan: true
  id: bus_a
  frequency: 100kHz

spi:
  clk_pin: GPIO11
  mosi_pin: GPIO12

time:
  - platform: pcf85063
    id: rtc_time
    timezone: Asia/Shanghai
    address: 0x51
    i2c_id: bus_a
  - platform: sntp
    id: sntp_time
    timezone: Asia/Shanghai
    servers:
      - ntp.nju.edu.cn
    update_interval: 24h
    on_time_sync:
      then:
        - logger.log:
            level: INFO
            format: "SNTP synced from ntp.nju.edu.cn, writing RTC"
        - pcf85063.write_time:
            id: rtc_time
  - platform: homeassistant
    id: ha_time
    timezone: Asia/Shanghai
    on_time_sync:
      then:
        - pcf85063.write_time:
            id: rtc_time

