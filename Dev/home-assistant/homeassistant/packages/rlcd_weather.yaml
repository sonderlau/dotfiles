# 桌面屏天气：当前状况直接读 weather.forecast_wo_de_jia
# 未来 1 小时：hourly forecast 写入 helper（HA 2024+ 的 forecast 不在 weather 属性里）
#
# 拷到 HA config/packages/ 后重启 core。如果 helper 已在 UI 建过，HA 会提示 already configured，可忽略。

input_text:
  weather_next_hour_condition:
    name: Weather Next Hour Condition
    icon: mdi:clock-outline
    max: 32
    initial: "--"

input_number:
  weather_next_hour_temp:
    name: Weather Next Hour Temp
    icon: mdi:thermometer
    min: -40
    max: 60
    step: 0.1
    unit_of_measurement: "°C"
    mode: box
    initial: 0

automation:
  - id: rlcd_weather_next_hour
    alias: RLCD weather next hour
    mode: single
    trigger:
      - trigger: time_pattern
        minutes: "/15"
      - trigger: homeassistant
        event: start
    action:
      - action: weather.get_forecasts
        target:
          entity_id: weather.forecast_wo_de_jia
        data:
          type: hourly
        response_variable: wx
      - action: input_text.set_value
        target:
          entity_id: input_text.weather_next_hour_condition
        data:
          value: >
            {% set items = wx['weather.forecast_wo_de_jia'].forecast | default([]) %}
            {% set ns = namespace(c='--') %}
            {% for x in items %}
              {% if as_datetime(x.datetime) >= now() + timedelta(minutes=50) %}
                {% set ns.c = x.condition %}
                {% break %}
              {% endif %}
            {% endfor %}
            {{ ns.c }}
      - action: input_number.set_value
        target:
          entity_id: input_number.weather_next_hour_temp
        data:
          value: >
            {% set items = wx['weather.forecast_wo_de_jia'].forecast | default([]) %}
            {% set ns = namespace(t=none) %}
            {% for x in items %}
              {% if as_datetime(x.datetime) >= now() + timedelta(minutes=50) %}
                {% set ns.t = x.temperature %}
                {% break %}
              {% endif %}
            {% endfor %}
            {{ ns.t if ns.t is not none else states('input_number.weather_next_hour_temp') }}
