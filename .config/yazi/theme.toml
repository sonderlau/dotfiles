# "$schema" = "https://yazi-rs.github.io/schemas/theme.json"

[flavor]
# Ghostty can report a light color-scheme (macOS appearance) even when the
# theme background is dark. Yazi then skips `dark` and the flavor never loads.
dark = "ayu-dark-solid"
light = "ayu-dark-solid"

[which]
# Use an ASCII separator so the key hints render with any terminal font.
separator = " > "
