# vim:fileencoding=utf-8:foldmethod=marker
# Contrast pass for Ghostty at 85% opacity.
# Never put an accent (#89b4fa and friends) on a gray surface.
# Badges use near-black #11111b on a light chip, not navy on pastel.

# : Manager {{{

[mgr]
cwd = { fg = "#94e2d5" }

# Find
find_keyword  = { fg = "#f9e2af", bold = true, italic = true, underline = true }
find_position = { fg = "#f5c2e7", bg = "reset", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#a6e3a1", bg = "#a6e3a1" }
marker_cut      = { fg = "#f38ba8", bg = "#f38ba8" }
marker_marked   = { fg = "#94e2d5", bg = "#94e2d5" }
marker_selected = { fg = "#f9e2af", bg = "#f9e2af" }

# Count
count_copied   = { fg = "#11111b", bg = "#a6e3a1" }
count_cut      = { fg = "#11111b", bg = "#f38ba8" }
count_selected = { fg = "#11111b", bg = "#f9e2af" }

# Border
border_symbol = "│"
border_style  = { fg = "#7f849c" }

# : }}}


# : Tabs {{{

[indicator]
parent  = { fg = "#11111b", bg = "#cdd6f4" }
current = { fg = "#11111b", bg = "#cdd6f4", bold = true }
preview = { underline = true }

[tabs]
active   = { fg = "#11111b", bg = "#cdd6f4", bold = true }
inactive = { fg = "#cdd6f4", bg = "#313244" }

# : }}}


# : Mode {{{

[mode]

normal_main = { fg = "#11111b", bg = "#cdd6f4", bold = true }
normal_alt  = { fg = "#cdd6f4", bg = "#313244" }

# Select mode
select_main = { fg = "#11111b", bg = "#a6e3a1", bold = true }
select_alt  = { fg = "#cdd6f4", bg = "#313244" }

# Unset mode
unset_main = { fg = "#11111b", bg = "#f9e2af", bold = true }
unset_alt  = { fg = "#cdd6f4", bg = "#313244" }

# : }}}


# : Status bar {{{

[status]
# Permissions
perm_sep   = { fg = "#7f849c" }
perm_type  = { fg = "#89b4fa" }
perm_read  = { fg = "#f9e2af" }
perm_write = { fg = "#f38ba8" }
perm_exec  = { fg = "#a6e3a1" }

# Progress
progress_label  = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#cdd6f4", bg = "#313244" }
progress_error  = { fg = "#11111b", bg = "#f38ba8" }

# : }}}


# : Pick {{{

[pick]
border   = { fg = "#89b4fa" }
active   = { fg = "#f5c2e7", bold = true }
inactive = {}

# : }}}


# : Input {{{

[input]
border   = { fg = "#89b4fa" }
title    = {}
value    = {}
selected = { reversed = true }

# : }}}


# : Completion {{{

[cmp]
border = { fg = "#89b4fa" }

# : }}}


# : Tasks {{{

[tasks]
border  = { fg = "#89b4fa" }
title   = {}
hovered = { fg = "#f5c2e7", bold = true }

# : }}}


# : Which {{{

[which]
border          = { fg = "#89b4fa" }
cand            = { fg = "#94e2d5" }
rest            = { fg = "#cdd6f4" }
desc            = { fg = "#f5c2e7" }
separator       = "  "
separator_style = { fg = "#9399b2" }

# : }}}


# : Help {{{

[help]
on      = { fg = "#94e2d5" }
run     = { fg = "#f5c2e7" }
hovered = { reversed = true, bold = true }
footer  = { fg = "#11111b", bg = "#cdd6f4" }

# : }}}


# : Spotter {{{

[spot]
border   = { fg = "#89b4fa" }
title    = { fg = "#89b4fa" }
tbl_col  = { fg = "#94e2d5" }
tbl_cell = { fg = "#cdd6f4", bg = "#313244" }

# : }}}


# : Notification {{{

[notify]
title_info  = { fg = "#a6e3a1" }
title_warn  = { fg = "#f9e2af" }
title_error = { fg = "#f38ba8" }

# : }}}


# : File-specific styles {{{

[filetype]

rules = [
	# Image
	{ mime = "**/image/*", fg = "#94e2d5" },
	# Media
	{ mime = "**/{audio,video}/*", fg = "#f9e2af" },
	# Archive
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },
	# Document
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#a6e3a1" },
	# Virtual file system
	{ mime = "vfs/{absent,stale}", fg = "#9399b2" },
	# Fallback
	{ url = "*", fg = "#cdd6f4" },
	{ url = "*/", fg = "#89b4fa" },
]

# : }}}

[icon]

dirs = [
	{ name = ".config", text = "", fg = "#f5c2e7" },
	{ name = ".git", text = "", fg = "#94e2d5" },
	{ name = ".github", text = "", fg = "#89b4fa" },
	{ name = ".npm", text = "", fg = "#89b4fa" },
	{ name = "Desktop", text = "", fg = "#94e2d5" },
	{ name = "Development", text = "", fg = "#94e2d5" },
	{ name = "Documents", text = "", fg = "#94e2d5" },
	{ name = "Downloads", text = "", fg = "#94e2d5" },
	{ name = "Library", text = "", fg = "#94e2d5" },
	{ name = "Movies", text = "", fg = "#94e2d5" },
	{ name = "Music", text = "", fg = "#94e2d5" },
	{ name = "Pictures", text = "", fg = "#94e2d5" },
	{ name = "Public", text = "", fg = "#94e2d5" },
	{ name = "Videos", text = "", fg = "#94e2d5" },
]
conds = [
	# Special files
	{ if = "orphan", text = "", fg = "#cdd6f4" },
	{ if = "link", text = "", fg = "#7f849c" },
	{ if = "block", text = "", fg = "#f2cdcd" },
	{ if = "char", text = "", fg = "#f2cdcd" },
	{ if = "fifo", text = "", fg = "#f2cdcd" },
	{ if = "sock", text = "", fg = "#f2cdcd" },
	{ if = "sticky", text = "", fg = "#f2cdcd" },
	{ if = "dummy", text = "", fg = "#f38ba8" },

	# Fallback
	{ if = "dir & hovered", text = "", fg = "#89b4fa" },
	{ if = "dir", text = "", fg = "#89b4fa" },
	{ if = "exec", text = "", fg = "#a6e3a1" },
	{ if = "!dir", text = "", fg = "#cdd6f4" },
]
