gui:
  showRandomTip: false
  showBottomLine: false
  nerdFontsVersion: "3"
  theme:
    selectedLineBgColor:
      - "#393552"
git:
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never --true-color=always
      useConfig: false
customCommands:
  - key: "<c-g>"
    context: "files"
    command: >-
      printf '%s' '{{printf "%x" .Form.Message}}' | xxd -r -p | git commit --cleanup=verbatim -F -
    description: "DeepSeek: Conventional Commit (no emoji)"
    prompts:
      - type: "menuFromCommand"
        title: "DeepSeek: choose a commit message"
        key: "Suggestion"
        command: >-
          sh -c '"$HOME/.config/lazygit/deepseek-commit"'
      - type: "input"
        title: "Edit commit message (confirm to commit)"
        key: "Message"
        initialValue: "{{.Form.Suggestion}}"
    loadingText: "Committing"
    output: "log"
  - key: "<c-t>"
    context: "files"
    command: >-
      printf '%s' '{{printf "%x" .Form.Message}}' | xxd -r -p | git commit --cleanup=verbatim -F -
    description: "DeepSeek: Gitmoji commit"
    prompts:
      - type: "menuFromCommand"
        title: "DeepSeek: choose a Gitmoji message"
        key: "Suggestion"
        command: >-
          sh -c '"$HOME/.config/lazygit/deepseek-commit" --gitmoji'
      - type: "input"
        title: "Edit commit message (confirm to commit)"
        key: "Message"
        initialValue: "{{.Form.Suggestion}}"
    loadingText: "Committing"
    output: "log"
